name: Docs Site

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, mintlify-docs]
    paths:
      - ".github/workflows/docs-site.yml"
      - "docs-site/**"
      - "pylib/tools/genhooks.py"
      - "pylib/tools/hookslib.py"
      - "qt/tools/genhooks_gui.py"
      - "tools/mintlify_hooks.py"
      - "tools/tests/test_mintlify_hooks.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 #v10.3.3
        with:
          version-file: ".tool-versions"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: "22.20.0"

      # Validation only: the job has a read-only token and no secrets.
      - name: Install Mintlify CLI
<<<<<<< HEAD
